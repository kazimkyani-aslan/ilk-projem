<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kazım - Kişisel Sayfa</title>
  <style>
    :root {
      --bg: #f5f6fa;
      --card-bg: #ffffff;
      --text: #1f2430;
      --muted: #5a6072;
      --accent: #4f46e5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      padding: 24px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #818cf8);
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 32px;
      font-weight: 600;
    }

    h1 {
      font-size: 28px;
      margin: 0 0 16px;
    }

    p {
      color: var(--muted);
      line-height: 1.6;
      font-size: 16px;
      margin: 0;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar">K</div>
    <h1>Merhaba, ben Kazım</h1>
    <p>
      Yazılım geliştirmeyle ilgilenen, yeni teknolojiler öğrenmeyi ve
      küçük projeler üretmeyi seven biriyim. Bu sayfa, kendimi tanıtmak
      için hazırladığım basit bir web sitesi. Zamanla buraya yeni
      bölümler ve projeler ekleyeceğim.
    </p>
  </main>
</body>
</html>
